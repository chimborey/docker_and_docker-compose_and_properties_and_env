spring.application.name=ChatAppication_demo


#==================================Server===============================================
server.port=8090

#==================================Database===============================================
spring.datasource.url=${SPRING_URL:jdbc:postgresql://localhost:5432/Chat_Application_Demo}
spring.datasource.username=${SPRING_USERNAME:postgres}
spring.datasource.password=${SPRING_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${SPRING_DDL:none}
spring.jpa.show-sql=${SPRING_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

#==================================Flyway===============================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATION:classpath:db/migration}
